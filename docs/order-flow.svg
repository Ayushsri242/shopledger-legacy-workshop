<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger UI, Express routes, library modules, configuration and JSON data store. Arrows show order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.section{font-size:19px;font-weight:700}.boxTitle{font-size:16px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}.ui{fill:#eff6ff;stroke:#3b82f6}.route{fill:#f5f3ff;stroke:#8b5cf6}.lib{fill:#f0fdf4;stroke:#22a06b}.data{fill:#fff7ed;stroke:#f97316}.note{fill:#f8fafc;stroke:#94a3b8}.wire{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#flowArrow)}.soft{fill:none;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#f8fafc"/>
  <text x="750" y="54" text-anchor="middle" class="title">ShopLedger — architecture &amp; order flow</text>
  <text x="750" y="82" text-anchor="middle" class="small" fill="#475569">Solid blue arrows trace POST /api/orders; gray arrows show other dependencies</text>

  <text x="48" y="138" class="section">Browser</text>
  <rect x="48" y="158" width="245" height="150" class="box ui"/>
  <text x="170" y="190" text-anchor="middle" class="boxTitle">public/</text>
  <text x="170" y="219" text-anchor="middle" class="small">index.html · app.js · style.css</text>
  <text x="170" y="246" text-anchor="middle" class="small">POS, orders, customers, reports</text>
  <text x="170" y="273" text-anchor="middle" class="small">Calls JSON API</text>

  <text x="363" y="138" class="section">Express server · server.js</text>
  <rect x="355" y="158" width="745" height="340" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" rx="18"/>
  <rect x="385" y="195" width="320" height="105" class="box route"/>
  <text x="545" y="226" text-anchor="middle" class="boxTitle">routes/orders.js</text>
  <text x="545" y="252" text-anchor="middle" class="small">GET /orders · GET /orders/:id</text>
  <text x="545" y="277" text-anchor="middle" class="small">POST /orders · POST /orders/:id/cancel</text>
  <rect x="750" y="195" width="320" height="105" class="box route"/>
  <text x="910" y="226" text-anchor="middle" class="boxTitle">routes/products.js</text>
  <text x="910" y="255" text-anchor="middle" class="small">GET /products · GET /coupons</text>
  <rect x="385" y="335" width="320" height="105" class="box route"/>
  <text x="545" y="366" text-anchor="middle" class="boxTitle">routes/customers.js</text>
  <text x="545" y="395" text-anchor="middle" class="small">GET /customers · POST /settle</text>
  <rect x="750" y="335" width="320" height="105" class="box route"/>
  <text x="910" y="366" text-anchor="middle" class="boxTitle">routes/reports.js</text>
  <text x="910" y="393" text-anchor="middle" class="small">dashboard · GST reconciliation</text>
  <text x="910" y="416" text-anchor="middle" class="small">pricing preview · admin export</text>

  <text x="1140" y="138" class="section">Settings &amp; storage</text>
  <rect x="1140" y="158" width="300" height="120" class="box note"/>
  <text x="1290" y="190" text-anchor="middle" class="boxTitle">config.js</text>
  <text x="1290" y="219" text-anchor="middle" class="small">port · shop · GST slabs</text>
  <text x="1290" y="245" text-anchor="middle" class="small">inventory rules · coupons</text>
  <rect x="1140" y="344" width="300" height="120" class="box data"/>
  <text x="1290" y="378" text-anchor="middle" class="boxTitle">data/db.json</text>
  <text x="1290" y="407" text-anchor="middle" class="small">products · orders · customers</text>
  <text x="1290" y="433" text-anchor="middle" class="small">settlements · audit log</text>

  <text x="48" y="550" class="section">lib/ modules</text>
  <rect x="48" y="570" width="250" height="110" class="box lib"/><text x="173" y="602" text-anchor="middle" class="boxTitle">store.js</text><text x="173" y="632" text-anchor="middle" class="small">read / write JSON, audit</text>
  <rect x="328" y="570" width="250" height="110" class="box lib"/><text x="453" y="602" text-anchor="middle" class="boxTitle">inventory.js</text><text x="453" y="632" text-anchor="middle" class="small">find, check, reserve, release</text>
  <rect x="608" y="570" width="250" height="110" class="box lib"/><text x="733" y="602" text-anchor="middle" class="boxTitle">pricing.js · coupons.js · tax.js</text><text x="733" y="632" text-anchor="middle" class="small">subtotal, discounts, GST totals</text>
  <rect x="888" y="570" width="250" height="110" class="box lib"/><text x="1013" y="602" text-anchor="middle" class="boxTitle">orders.js · ledger.js</text><text x="1013" y="632" text-anchor="middle" class="small">order lifecycle · Khata balance</text>
  <rect x="1168" y="570" width="272" height="110" class="box lib"/><text x="1304" y="602" text-anchor="middle" class="boxTitle">invoice.js · reports.js · dates.js</text><text x="1304" y="632" text-anchor="middle" class="small">invoice, reports, date helpers</text>

  <text x="48" y="735" class="section" fill="#1d4ed8">Order placement flow · POST /api/orders</text>
  <rect x="48" y="765" width="190" height="104" class="box ui"/><text x="143" y="799" text-anchor="middle" class="boxTitle">1 · POS UI</text><text x="143" y="829" text-anchor="middle" class="small">cart + customer</text>
  <rect x="282" y="765" width="190" height="104" class="box route"/><text x="377" y="799" text-anchor="middle" class="boxTitle">2 · orders route</text><text x="377" y="829" text-anchor="middle" class="small">validate request</text>
  <rect x="516" y="765" width="190" height="104" class="box lib"/><text x="611" y="799" text-anchor="middle" class="boxTitle">3 · inventory</text><text x="611" y="829" text-anchor="middle" class="small">check stock</text>
  <rect x="750" y="765" width="190" height="104" class="box lib"/><text x="845" y="799" text-anchor="middle" class="boxTitle">4 · pricing + tax</text><text x="845" y="829" text-anchor="middle" class="small">coupon + totals</text>
  <rect x="984" y="765" width="190" height="104" class="box lib"/><text x="1079" y="799" text-anchor="middle" class="boxTitle">5 · ledger (if Khata)</text><text x="1079" y="829" text-anchor="middle" class="small">credit check + charge</text>
  <rect x="1218" y="765" width="222" height="104" class="box data"/><text x="1329" y="799" text-anchor="middle" class="boxTitle">6 · orders + store</text><text x="1329" y="829" text-anchor="middle" class="small">reserve, save, respond</text>
  <path d="M238 817 H278" class="flow"/><path d="M472 817 H512" class="flow"/><path d="M706 817 H746" class="flow"/><path d="M940 817 H980" class="flow"/><path d="M1174 817 H1214" class="flow"/>
  <path d="M170 308 V485 H545 V300" class="wire"/>
  <path d="M705 247 H746" class="soft"/>
  <path d="M545 300 V335" class="soft"/>
  <path d="M910 300 V335" class="soft"/>
  <path d="M1070 247 H1110 V402 H1136" class="soft"/>
  <path d="M705 247 H1110 V404 H1136" class="soft"/>
  <path d="M173 680 V716 H143 V761" class="soft"/>
  <text x="750" y="935" text-anchor="middle" class="tiny" fill="#64748b">Only repository modules and paths shown. Endpoint paths are mounted under /api in server.js.</text>
</svg>
